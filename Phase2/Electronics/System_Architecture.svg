<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs><style>
.bg{fill:#f5f7fb}.panel{fill:#fff;stroke:#25344a;stroke-width:2;rx:16}.ctrl{fill:#e8f1ff;stroke:#2563eb;stroke-width:3;rx:16}.sensor{fill:#e9f8ef;stroke:#15803d;stroke-width:2;rx:14}.power{fill:#fff3df;stroke:#c07812;stroke-width:2;rx:14}.motor{fill:#f4eaff;stroke:#7e22ce;stroke-width:2;rx:14}.title{font:700 28px Arial;fill:#172033}.h{font:700 19px Arial;fill:#172033}.t{font:15px Arial;fill:#334155}.small{font:13px Arial;fill:#475569}.wire{stroke:#475569;stroke-width:3;fill:none}.pwire{stroke:#c07812;stroke-width:4;fill:none}.dash{stroke-dasharray:8 7}
</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#475569"/></marker></defs>
<rect class="bg" width="1200" height="820"/><text class="title" x="600" y="48" text-anchor="middle">PeraBots Phase 2 — Proposed Electronics Architecture</text><text class="small" x="600" y="76" text-anchor="middle">Modular two-wheel differential-drive controller • planning diagram, not a PCB schematic</text>
<rect class="power" x="45" y="130" width="245" height="120"/><text class="h" x="167" y="162" text-anchor="middle">Battery + Protection</text><text class="t" x="167" y="190" text-anchor="middle">Battery • fuse • main switch</text><text class="t" x="167" y="216" text-anchor="middle">Sized to motor load</text>
<rect class="power" x="45" y="300" width="245" height="115"/><text class="h" x="167" y="333" text-anchor="middle">Regulated Supplies</text><text class="t" x="167" y="361" text-anchor="middle">Logic rail(s) as required</text><text class="t" x="167" y="386" text-anchor="middle">Buck converter + decoupling</text>
<rect class="ctrl" x="410" y="235" width="365" height="250"/><text class="h" x="592" y="275" text-anchor="middle">ESP32-S3 Development Board</text><text class="t" x="592" y="311" text-anchor="middle">Line-following control / PID</text><text class="t" x="592" y="341" text-anchor="middle">Colour classification / decisions</text><text class="t" x="592" y="371" text-anchor="middle">Obstacle response / route logic</text><text class="t" x="592" y="401" text-anchor="middle">Encoder feedback / state machine</text><text class="small" x="592" y="448" text-anchor="middle">Removable module on carrier PCB</text>
<rect class="sensor" x="875" y="115" width="275" height="105"/><text class="h" x="1012" y="148" text-anchor="middle">QTR-8RC Line Array</text><text class="t" x="1012" y="178" text-anchor="middle">8 reflectance channels</text><text class="small" x="1012" y="200" text-anchor="middle">GPIO / timing interface</text>
<rect class="sensor" x="875" y="260" width="275" height="105"/><text class="h" x="1012" y="293" text-anchor="middle">VL53L0X Distance</text><text class="t" x="1012" y="323" text-anchor="middle">Forward obstacle distance</text><text class="small" x="1012" y="345" text-anchor="middle">I2C</text>
<rect class="sensor" x="875" y="405" width="275" height="105"/><text class="h" x="1012" y="438" text-anchor="middle">Colour Sensor</text><text class="t" x="1012" y="468" text-anchor="middle">TCS34725 or tested TCS3200</text><text class="small" x="1012" y="490" text-anchor="middle">I2C for TCS34725</text>
<rect class="motor" x="410" y="565" width="365" height="110"/><text class="h" x="592" y="599" text-anchor="middle">TB6612FNG Dual Motor Driver</text><text class="t" x="592" y="628" text-anchor="middle">Independent left / right control</text><text class="small" x="592" y="652" text-anchor="middle">Verify motor and driver ratings</text>
<rect class="motor" x="45" y="565" width="245" height="110"/><text class="h" x="167" y="599" text-anchor="middle">Two Encoder Motors</text><text class="t" x="167" y="628" text-anchor="middle">Left + right drive</text><text class="small" x="167" y="652" text-anchor="middle">Encoder A/B feedback</text>
<rect class="panel" x="875" y="565" width="275" height="110"/><text class="h" x="1012" y="599" text-anchor="middle">Optional / Expansion</text><text class="t" x="1012" y="628" text-anchor="middle">MPU6050 • buzzer • start button</text><text class="small" x="1012" y="652" text-anchor="middle">Future mechanism connector</text>
<path class="pwire" d="M167 250 V300" marker-end="url(#arr)"/><path class="pwire" d="M290 357 H350 V450 H410" marker-end="url(#arr)"/><path class="pwire" d="M167 415 V520 H592 V565" marker-end="url(#arr)"/><path class="wire" d="M875 167 H815 V270 H775" marker-end="url(#arr)"/><path class="wire" d="M875 312 H825 V340 H775" marker-end="url(#arr)"/><path class="wire" d="M875 457 H825 V405 H775" marker-end="url(#arr)"/><path class="wire" d="M592 485 V565" marker-end="url(#arr)"/><path class="wire" d="M410 620 H290" marker-end="url(#arr)"/><path class="wire dash" d="M290 620 H350 V700 H592 V675" marker-end="url(#arr)"/><path class="wire dash" d="M775 620 H835 V620 H875" marker-end="url(#arr)"/>
<text class="small" x="600" y="740" text-anchor="middle">Dashed connections indicate encoder feedback / optional expansion routing.</text><text class="small" x="600" y="770" text-anchor="middle">Verify signal voltage, GPIOs, connectors and power ratings before fabrication.</text></svg>